name: Feature Request
description: Suggest an idea or improvement for the application
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please explain the problem and how your idea would help.
  - type: textarea
    id: problem
    attributes:
      label: Description
      description: What would you like to see implemented?
      placeholder: Could you add an Open AI Provider?
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, examples, links, or any other relevant details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this has not already been requested.
          required: true
